services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      UV_NO_SYNC: "1"
      HF_HOME: /models
    volumes:
      - whisper_models:/models

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_ORIGIN: http://api:8000
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_ORIGIN: http://api:8000
    depends_on:
      - api

volumes:
  whisper_models:
