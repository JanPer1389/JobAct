model_list:
  - model_name: report-drafter
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash-latest
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: report-drafter-fallback
    litellm_params:
      model: openrouter/openai/gpt-4.1-mini
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: visual-auditor
    litellm_params:
      model: openrouter/qwen/qwen3-vl-32b-instruct
      api_key: os.environ/OPENROUTER_API_KEY
litellm_settings:
  drop_params: true
  num_retries: 2
  request_timeout: 600
