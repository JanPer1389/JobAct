[project]
name = "jobact-backend"
version = "0.1.0"
description = "JobAct backend API"
readme = "README.md"
authors = [
    { name = "JanPer1389", email = "josefvorobyev133@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "redis",
    "aioboto3",
    "authlib",
    "httpx",
    "reportlab",
    "litellm",
    "pydantic-ai",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers",
    "ruff",
    "mypy",
]

[project.scripts]
jobact-backend = "jobact:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jobact"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
