services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      UV_NO_SYNC: "1"
      HF_HOME: /models
    volumes:
      - whisper_models:/models
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Next.js inlines NEXT_PUBLIC_* at `next build` time (baked into the
        # routes manifest the production server serves from), so this must
        # be a build arg, not just a runtime `environment:` value below --
        # the latter has no effect on an already-built image.
        NEXT_PUBLIC_API_ORIGIN: http://api:8000
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  whisper_models:
